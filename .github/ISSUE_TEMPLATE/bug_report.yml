name: Bug report
description: Report a reproducible problem in Potez.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a short PGN if the problem involves an import or move.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox on Windows, Safari on iPhone
